[project]
name = "tmodel"
version = "0.1.0"
description = "Structured threat models: schema, validation, lint, diagrams, and a local editor."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    "types-pyyaml>=6",
    "watchfiles>=0.24",
]  # watchfiles: serve --reload sees templates

[project.scripts]
tmodel = "tmodel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests need node + Playwright: opt in with `pytest -m browser`.
markers = ["browser: drives a real browser through scripts/ui.mjs (needs node + Playwright)"]
addopts = "-m 'not browser'"

# Incremental typing: enforce the new mutation/storage/client boundaries first.
# Imported modules are analyzed for types but their pre-existing errors stay out of this gate.
[tool.mypy]
files = ["tmodel/client.py", "tmodel/editing.py", "tmodel/web/store.py"]
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "SIM108",  # ternary-over-if is often less readable
    "RUF012",  # mutable class attrs: pydantic/dataclass fields are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
