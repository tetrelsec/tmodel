{# full form: label + widget + help for each FieldSpec in `fields` #}
{% for f in fields %}
<div class="field">
  <label for="f-{{ f.name }}">{{ f.label }}{% if f.required %} <span class="req">*</span>{% endif %}</label>
  {% include "_widget.html" %}
  {% if f.help %}<div class="help">{{ f.help }}</div>{% endif %}
</div>
{% endfor %}
